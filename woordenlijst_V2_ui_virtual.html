<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woordenlijst NL–FR — V2 (virtualized UI)</title>
<style>
  :root{--bg:#fff;--text:#0b1220;--muted:#6b7280;--accent:#0b5fff}
  body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
  header{position:sticky;top:0;background:#fff;padding:12px 16px;border-bottom:1px solid #e6e6e6;z-index:20}
  .wrap{max-width:1200px;margin:0 auto}
  h1{margin:0;font-size:20px}
  .controls{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  input.search{flex:1;min-width:220px;padding:10px 12px;border-radius:10px;border:1px solid #e6e6e6;font-size:15px}
  .meta{font-size:13px;color:var(--muted)}
  main{max-width:1200px;margin:12px auto;padding:0 16px}

  /* Virtual list */
  .viewport{height:72vh;border:1px solid #eef2f7;border-radius:8px;overflow:auto;position:relative;background:#fff}
  .spacer{width:100%;height:1px;opacity:0}
  .list{position:absolute;left:0;right:0;top:0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 12px;border-bottom:1px solid #f3f4f6;align-items:start}
  .row:nth-child(odd){background:#fbfdff}
  .nl{font-weight:600}
  .fr{color:#374151}
  .loading{padding:18px;text-align:center;color:var(--muted)}
  .small{font-size:13px;color:var(--muted)}
  @media (max-width:720px){ .row{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Woordenlijst NL–FR — V2 (virtualized UI)</h1>
    <div class="controls">
      <input id="q" class="search" type="search" placeholder="Zoek in NL of FR… (min. 2 tekens, fuzzy)" aria-label="Zoek">
      <div class="meta" id="meta">Laden…</div>
    </div>
  </div>
</header>
<main>
  <div class="wrap">
    <div id="viewport" class="viewport" role="list" aria-label="Woordenlijst resultaten">
      <div id="spacer" class="spacer"></div>
      <div id="list" class="list"></div>
      <div id="loading" class="loading">Laden woordenlijst…</div>
    </div>
  </div>
</main>

<script>
(function(){
  const RAW_URL = 'https://cdn.jsdelivr.net/gh/antonnoe/tom-polak-taalarchief@main/woordenlijst_V2.html';
  const viewport = document.getElementById('viewport');
  const spacer = document.getElementById('spacer');
  const listEl = document.getElementById('list');
  const loading = document.getElementById('loading');
  const meta = document.getElementById('meta');
  const qInput = document.getElementById('q');

  let data = []; // array of {nl,fr}
  let indexList = []; // indices of items currently in result (after filter)
  const rowHeight = 44; // px - fixed row height for virtualization
  const buffer = 12; // number of buffer rows above/below
  let viewportHeight = 0;

  function setMeta(t){ meta.textContent = t; }

  function decodeHtml(html){
    const doc = new DOMParser().parseFromString(html,'text/html');
    return doc.body.textContent || '';
  }

  function parseRowsFromHtml(html){
    // extract tbody
    const tbMatch = html.match(/<tbody[^>]*>([\s\S]*?)<\/tbody>/i);
    const tbody = tbMatch ? tbMatch[1] : html;
    const rowRe = /<tr[^>]*>([\s\S]*?)<\/tr>/gi;
    const tdRe = /<td[^>]*>([\s\S]*?)<\/td>/gi;
    const rows = [];
    let m; while((m = rowRe.exec(tbody))!==null){ const rowHtml = m[1];
      const tds = [];
      let mm; tdRe.lastIndex = 0; while((mm = tdRe.exec(rowHtml))!==null){ tds.push(mm[1]); if(tds.length>=2) break; }
      if(tds.length>=2){ const nl = decodeHtml(tds[0].trim()); const fr = decodeHtml(tds[1].trim()); rows.push({nl,fr}); }
    }
    return rows;
  }

  async function load(){
    try{
      loading.style.display = '';
      setMeta('Ophalen...');
      const res = await fetch(RAW_URL);
      if(!res.ok) throw new Error('Netwerkfout: '+res.status);
      const text = await res.text();
      setMeta('Parseren...');
      data = parseRowsFromHtml(text);
      indexList = data.map((_,i)=>i);
      setMeta(indexList.length+' ingangen');
      loading.style.display = 'none';
      // initialize virtual list sizes
      viewportHeight = viewport.clientHeight;
      spacer.style.height = (indexList.length * rowHeight) + 'px';
      // initial render
      render();
    }catch(err){
      loading.textContent = 'Fout bij laden: '+err.message; loading.style.display=''; setMeta('Fout'); console.error(err);
    }
  }

  function createRow(idx){ const item = data[idx]; const el = document.createElement('div'); el.className='row'; el.setAttribute('role','listitem'); el.style.height = rowHeight + 'px'; el.innerHTML = '<div class="nl">'+escapeHtml(item.nl)+'</div><div class="fr">'+escapeHtml(item.fr)+'</div>'; return el; }

  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  let lastRender = {start:-1,end:-1};
  function render(){
    const scrollTop = viewport.scrollTop;
    const startIndex = Math.max(0, Math.floor(scrollTop/rowHeight) - buffer);
    const visibleCount = Math.ceil(viewport.clientHeight / rowHeight) + buffer*2;
    const endIndex = Math.min(indexList.length-1, startIndex + visibleCount -1);
    if(startIndex === lastRender.start && endIndex === lastRender.end) return;
    lastRender = {start:startIndex,end:endIndex};
    // position list
    listEl.style.transform = 'translateY(' + (startIndex * rowHeight) + 'px)';
    listEl.innerHTML = '';
    for(let i=startIndex;i<=endIndex;i++){
      const idx = indexList[i];
      const row = createRow(idx);
      listEl.appendChild(row);
    }
    setMeta((indexList.length)+' ingangen — tonen '+(endIndex-startIndex+1));
  }

  let rafPending = false;
  viewport.addEventListener('scroll', ()=>{ if(!rafPending){ rafPending=true; requestAnimationFrame(()=>{ render(); rafPending=false; }); } });

  function fuzzyMatch(q, text){ // simple case-insensitive substring OR token Levenshtein fallback
    if(!q) return true;
    const s = q.toLowerCase(); const t = text.toLowerCase(); if(t.indexOf(s)!==-1) return true;
    // fallback: levenshtein on tokens (cheap heuristic)
    const qlen = s.length; if(qlen<=1) return false;
    const tokens = t.split(/\s+/).filter(Boolean);
    for(const tok of tokens){ if(Math.abs(tok.length-qlen) > 3) continue; const d = levenshtein(s, tok); if(d <= Math.max(1, Math.floor(Math.min(qlen, tok.length)*0.45))) return true; }
    return false;
  }

  function levenshtein(a,b){ if(a===b) return 0; const al=a.length, bl=b.length; if(al===0) return bl; if(bl===0) return al; let v0=new Array(bl+1), v1=new Array(bl+1); for(let j=0;j<=bl;j++) v0[j]=j; for(let i=0;i<al;i++){ v1[0]=i+1; for(let j=0;j<bl;j++){ const cost = a[i]===b[j]?0:1; v1[j+1]=Math.min(v1[j]+1, v0[j+1]+1, v0[j]+cost); } [v0,v1]=[v1,v0]; } return v0[bl]; }

  // filter logic
  let lastQuery='';
  function applyFilter(q){
    const qv = q.trim(); if(qv.length<1){ indexList = data.map((_,i)=>i); spacer.style.height = (indexList.length*rowHeight) + 'px'; render(); return; }
    const parts = qv.split(/\s+/).filter(Boolean);
    const res = [];
    for(let i=0;i<data.length;i++){
      const hay = (data[i].nl + ' ' + data[i].fr);
      let ok = true;
      for(const p of parts){ if(!fuzzyMatch(p, hay)){ ok=false; break; } }
      if(ok) res.push(i);
    }
    indexList = res;
    spacer.style.height = (indexList.length*rowHeight) + 'px';
    viewport.scrollTop = 0; // reset scroll to top of filtered results
    render();
  }

  let debounceTimer = null;
  qInput.addEventListener('input', (e)=>{
    const v = e.target.value || '';
    if(debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(()=>{ applyFilter(v); }, 150);
  });

  // start
  load();
  // adapt on resize
  window.addEventListener('resize', ()=>{ viewportHeight = viewport.clientHeight; render(); });

})();
</script>
</body>
</html>
